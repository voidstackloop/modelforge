[package]
name = "modelforge-native"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# "dyn-symbols" resolves the napi_* C ABI symbols dynamically instead of
# requiring them statically linked — without it, `cargo test` fails to link
# a standalone test binary at all (there's no Node process to supply those
# symbols outside of loading this crate as a real .node addon). It's part of
# napi's own default feature set; only explicit here because this crate
# otherwise opts out of defaults. Re-verified after adding it that the built
# addon still loads correctly under real Node (napi build + `require()`).
napi = { version = "3", default-features = false, features = ["napi4", "async", "tokio_rt", "error_anyhow", "dyn-symbols"] }
napi-derive = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
percent-encoding = "2"
sha2 = "0.11"
fs4 = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
governor = "0.10"
tokio-util = "0.7"
arc-swap = "1"
dashmap = "6"
# "bundled" statically links SQLite instead of requiring it be present on
# the build/runtime machine — required for a portable Electron addon, since
# we can't assume any particular system SQLite version (or its presence at
# all) on a user's machine.
rusqlite = { version = "0.40", features = ["bundled"] }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

[profile.release]
lto = true
strip = "symbols"
