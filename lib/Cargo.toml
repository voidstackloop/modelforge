[package]
name = "modelforge-native"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4", "async", "tokio_rt", "error_anyhow"] }
napi-derive = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
percent-encoding = "2"
sha2 = "0.11"
fs4 = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
governor = "0.10"
tokio-util = "0.7"
arc-swap = "1"
dashmap = "6"

[build-dependencies]
napi-build = "2"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

[profile.release]
lto = true
strip = "symbols"
